<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX Market</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: #0a0a0a; color: #e5e5e5; }

  header {
    background: #111; border-bottom: 1px solid #1f1f1f;
    padding: 16px 30px; display: flex; justify-content: space-between;
    align-items: center; position: sticky; top: 0; z-index: 100;
  }
  header h1 { font-size: 20px; font-weight: 800; cursor: pointer; }
  header h1 span { color: #4b7dff; }
  header .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
  header .user-info img { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #1f1f1f; background: #1a1a1a; }
  header .logout {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc;
    padding: 7px 16px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  header .logout:hover { background: #222; color: #fff; }

  .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box {
    background: #111; border: 1px solid #1f1f1f; padding: 48px 40px;
    border-radius: 16px; text-align: center; max-width: 400px; width: 100%;
  }
  .login-logo {
    width: 64px; height: 64px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #4b7dff, #8b5cf6);
    border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 28px;
  }
  .login-box h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .login-box p { color: #888; font-size: 14px; margin-bottom: 30px; }
  .login-btn {
    width: 100%; background: #fff; color: #0a0a0a; border: none;
    padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .login-btn:hover { background: #e5e5e5; }
  .login-btn svg { width: 20px; height: 20px; }

  .main-page { display: none; }
  .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
  .page-title { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
  .page-subtitle { color: #666; font-size: 14px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 16px; }

  .upload-btn, .chat-btn {
    background: #4b7dff; color: #fff; border: none; padding: 10px 18px;
    border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .upload-btn:hover, .chat-btn:hover { background: #3b6be0; }
  .chat-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; }
  .chat-btn:hover { background: #222; color: #fff; }
  .header-actions { display: flex; gap: 10px; align-items: center; }

  .categories { display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; }
  .cat-btn {
    background: #111; border: 1px solid #1f1f1f; color: #888;
    padding: 8px 18px; border-radius: 20px; font-size: 13px;
    font-weight: 500; cursor: pointer;
  }
  .cat-btn:hover { border-color: #333; color: #ccc; }
  .cat-btn.active { background: #fff; color: #0a0a0a; border-color: #fff; }

  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .product {
    background: #111; border: 1px solid #1f1f1f; border-radius: 12px;
    overflow: hidden; transition: all 0.2s;
  }
  .product:hover { border-color: #333; }
  .product-img {
    height: 150px; background: linear-gradient(135deg, #1a1a1a, #0f0f0f);
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; border-bottom: 1px solid #1f1f1f;
  }
  .product-body { padding: 16px; }
  .product-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; color: #fff; }
  .product-desc { font-size: 12.5px; color: #666; margin-bottom: 12px; line-height: 1.5; min-height: 36px; }
  .seller-row {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 0; border-top: 1px solid #1a1a1a;
    border-bottom: 1px solid #1a1a1a; margin-bottom: 12px;
  }
  .seller-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #4b7dff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .seller-name { font-size: 12px; color: #ccc; font-weight: 500; }
  .seller-label { font-size: 10px; color: #555; }
  .seller-info { flex: 1; min-width: 0; }
  .contact-btn {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc;
    padding: 4px 10px; border-radius: 6px; font-size: 11px;
    cursor: pointer; font-weight: 500;
  }
  .contact-btn:hover { background: #4b7dff; color: #fff; border-color: #4b7dff; }
  .product-footer { display: flex; justify-content: space-between; align-items: center; }
  .product-price { color: #4b7dff; font-weight: 700; font-size: 15px; }
  .product-badge {
    background: #1a1a1a; border: 1px solid #2a2a2a;
    padding: 3px 10px; border-radius: 6px;
    font-size: 11px; color: #888;
  }

  .empty { text-align: center; padding: 80px 20px; color: #555; font-size: 14px; }

  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.8); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #111; border: 1px solid #1f1f1f;
    border-radius: 16px; padding: 30px;
    max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto;
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .modal label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; margin-top: 14px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: #0a0a0a; border: 1px solid #1f1f1f;
    color: #fff; padding: 10px 14px; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 14px;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: #4b7dff; }
  .modal textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary {
    flex: 1; background: #4b7dff; color: #fff; border: none;
    padding: 12px; border-radius: 10px; font-weight: 700;
    font-size: 14px; cursor: pointer;
  }
  .btn-primary:hover { background: #3b6be0; }
  .btn-secondary {
    flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a;
    color: #ccc; padding: 12px; border-radius: 10px;
    font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .btn-secondary:hover { background: #222; }

  .chat-modal { max-width: 600px; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #1f1f1f; margin-bottom: 15px; }
  .chat-header h3 { font-size: 16px; margin: 0; }
  .chat-with { font-size: 12px; color: #888; }
  .messages {
    height: 350px; overflow-y: auto; padding: 10px 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .message {
    max-width: 70%; padding: 10px 14px; border-radius: 12px;
    font-size: 13.5px; line-height: 1.4; word-wrap: break-word;
  }
  .message.self { align-self: flex-end; background: #4b7dff; color: #fff; border-bottom-right-radius: 4px; }
  .message.other { align-self: flex-start; background: #1a1a1a; color: #e5e5e5; border-bottom-left-radius: 4px; }
  .message-time { font-size: 10px; opacity: 0.6; margin-top: 4px; }
  .chat-input-row { display: flex; gap: 10px; margin-top: 15px; }
  .chat-input-row input {
    flex: 1; background: #0a0a0a; border: 1px solid #1f1f1f;
    color: #fff; padding: 12px 16px; border-radius: 10px; font-size: 14px;
  }
  .chat-input-row input:focus { outline: none; border-color: #4b7dff; }
  .chat-send {
    background: #4b7dff; color: #fff; border: none;
    padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: 700;
  }
  .chat-send:hover { background: #3b6be0; }

  .chat-list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px; border-radius: 10px; cursor: pointer;
    background: #0a0a0a; border: 1px solid #1f1f1f; margin-bottom: 8px;
  }
  .chat-list-item:hover { border-color: #4b7dff; }
  .chat-list-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #4b7dff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
  }
  .chat-list-info { flex: 1; }
  .chat-list-name { font-size: 14px; font-weight: 600; }
  .chat-list-preview { font-size: 12px; color: #666; margin-top: 2px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1f1f1f; color: #fff; padding: 14px 24px;
    border-radius: 10px; font-size: 14px; opacity: 0;
    transition: all 0.3s; z-index: 1000; border: 1px solid #333;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #7f1d1d; border-color: #991b1b; }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="login-logo">🛒</div>
    <h2>RBX Market</h2>
    <p>Buy and sell Roblox systems, scripts, and models.</p>
    <button class="login-btn" onclick="startRobloxOAuth()">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M4.2 9.4l11.8-3.2 3.2 11.8-11.8 3.2z"/>
      </svg>
      Continue with Roblox
    </button>
  </div>
</div>

<div class="main-page" id="mainPage">
  <header>
    <h1 onclick="location.reload()">RBX <span>Market</span></h1>
    <div class="user-info">
      <img id="headerAvatar" src="" alt="">
      <span id="headerName"></span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="top-bar">
      <div>
        <h2 class="page-title">Products</h2>
        <p class="page-subtitle">Browse systems, scripts, and models from the community</p>
      </div>
      <div class="header-actions">
        <button class="chat-btn" onclick="openChatList()">💬 My Chats</button>
        <button class="upload-btn" onclick="openUploadModal()">+ Upload Product</button>
      </div>
    </div>

    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory(this, 'all')">All</button>
      <button class="cat-btn" onclick="filterCategory(this, 'scripts')">Scripts</button>
      <button class="cat-btn" onclick="filterCategory(this, 'systems')">Systems</button>
      <button class="cat-btn" onclick="filterCategory(this, 'models')">Models</button>
    </div>

    <div class="products" id="productsList"></div>
  </div>
</div>

<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <h3>Upload New Product</h3>
    <label>Title</label>
    <input type="text" id="upTitle" placeholder="e.g. Advanced Login System">
    <label>Description</label>
    <textarea id="upDesc" placeholder="Describe your product..."></textarea>
    <label>Price (R$)</label>
    <input type="number" id="upPrice" placeholder="100" min="1">
    <label>Category</label>
    <select id="upCat">
      <option value="scripts">Scripts</option>
      <option value="systems">Systems</option>
      <option value="models">Models</option>
    </select>
    <label>Icon (emoji)</label>
    <input type="text" id="upIcon" placeholder="📦" maxlength="2">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal('uploadModal')">Cancel</button>
      <button class="btn-primary" onclick="submitProduct()">Upload</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="chatListModal">
  <div class="modal chat-modal">
    <div class="chat-header">
      <h3>My Conversations</h3>
      <button class="btn-secondary" style="flex:none;padding:6px 14px;font-size:12px" onclick="closeModal('chatListModal')">Close</button>
    </div>
    <div id="chatListContent"></div>
  </div>
</div>

<div class="modal-overlay" id="chatModal">
  <div class="modal chat-modal">
    <div class="chat-header">
      <div>
        <h3 id="chatTitle">Chat</h3>
        <div class="chat-with" id="chatWith"></div>
      </div>
      <button class="btn-secondary" style="flex:none;padding:6px 14px;font-size:12px" onclick="closeChat()">Close</button>
    </div>
    <div class="messages" id="messagesBox"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button class="chat-send" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://dwjpeuoxkmyeupwkwffl.supabase.co";
const SUPABASE_KEY = "sb_publishable_oXKUYGvLfyYtRSEm8uB-Qw_rgorSqVD";

const ROBLOX_CLIENT_ID = "2409250177640362189";
const REDIRECT_URI = "http://localhost:3000/";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let allProducts = [];
let currentChatUser = null;
let currentCategory = 'all';
let messagesChannel = null;

function generateAvatar(name) {
  const letter = (name || 'U').charAt(0).toUpperCase();
  const colors = ['#4b7dff', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#06b6d4'];
  const color = colors[(name || '').charCodeAt(0) % colors.length] || '#4b7dff';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="${color}"/><text x="50%" y="50%" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">${letter}</text></svg>`;
  return 'data:image/svg+xml;base64,' + btoa(svg);
}

function showToast(msg, error) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (error ? ' error' : '');
  setTimeout(() => t.className = 'toast' + (error ? ' error' : ''), 3000);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

function openUploadModal() {
  document.getElementById('uploadModal').classList.add('active');
}

async function loadProducts() {
  const list = document.getElementById('productsList');
  list.innerHTML = '<div class="empty">Loading products...</div>';

  const { data, error } = await supabase
    .from('products')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    list.innerHTML = '<div class="empty">Error loading products</div>';
    return;
  }

  allProducts = data || [];
  renderProducts();
}

function renderProducts() {
  const list = document.getElementById('productsList');
  const filtered = currentCategory === 'all'
    ? allProducts
    : allProducts.filter(p => p.category === currentCategory);

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No products yet. Be the first to upload!</div>';
    return;
  }

  list.innerHTML = filtered.map(p => `
    <div class="product">
      <div class="product-img">${p.icon || '📦'}</div>
      <div class="product-body">
        <div class="product-title">${escapeHtml(p.title)}</div>
        <div class="product-desc">${escapeHtml(p.description || '')}</div>
        <div class="seller-row">
          <div class="seller-avatar">${(p.seller_name || 'U').charAt(0).toUpperCase()}</div>
          <div class="seller-info">
            <div class="seller-name">${escapeHtml(p.seller_name)}</div>
            <div class="seller-label">Seller</div>
          </div>
          ${p.seller_id !== currentUser.sub
            ? `<button class="contact-btn" onclick="startChat('${p.seller_id}', '${escapeAttr(p.seller_name)}')">Contact</button>`
            : '<span class="seller-label" style="color:#4b7dff">You</span>'}
        </div>
        <div class="product-footer">
          <span class="product-price">${escapeHtml(p.price)}</span>
          <span class="product-badge">${escapeHtml(p.category)}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function escapeAttr(s) {
  return String(s || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function filterCategory(btn, cat) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCategory = cat;
  renderProducts();
}

async function submitProduct() {
  const title = document.getElementById('upTitle').value.trim();
  const desc = document.getElementById('upDesc').value.trim();
  const price = document.getElementById('upPrice').value.trim();
  const cat = document.getElementById('upCat').value;
  const icon = document.getElementById('upIcon').value.trim() || '📦';

  if (!title || !desc || !price) {
    showToast('Please fill all fields', true);
    return;
  }

  const { error } = await supabase.from('products').insert({
    title, description: desc, price: price + ' R$',
    category: cat, icon: icon,
    seller_id: currentUser.sub,
    seller_name: currentUser.preferred_username || 'User'
  });

  if (error) { showToast('Error: ' + error.message, true); return; }

  showToast('Product uploaded!');
  closeModal('uploadModal');
  document.getElementById('upTitle').value = '';
  document.getElementById('upDesc').value = '';
  document.getElementById('upPrice').value = '';
  document.getElementById('upIcon').value = '';
  loadProducts();
}

function getRoomId(user1, user2) {
  return [user1, user2].sort().join('__');
}

function startChat(otherId, otherName) {
  currentChatUser = { id: otherId, name: otherName };
  document.getElementById('chatModal').classList.add('active');
  document.getElementById('chatTitle').textContent = 'Chat';
  document.getElementById('chatWith').textContent = 'with ' + otherName;
  document.getElementById('messagesBox').innerHTML = '';
  loadMessages();
  subscribeToMessages();
}

async function openChatList() {
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .or(`sender_id.eq.${currentUser.sub},receiver_id.eq.${currentUser.sub}`)
    .order('created_at', { ascending: false });

  const list = document.getElementById('chatListContent');
  if (error || !data || data.length === 0) {
    list.innerHTML = '<div class="empty">No conversations yet</div>';
  } else {
    const seen = new Set();
    const convos = [];
    data.forEach(m => {
      const otherId = m.sender_id === currentUser.sub ? m.receiver_id : m.sender_id;
      const otherName = m.sender_id === currentUser.sub ? m.receiver_name : m.sender_name;
      if (!seen.has(otherId)) {
        seen.add(otherId);
        convos.push({ id: otherId, name: otherName, last: m.content });
      }
    });
    list.innerHTML = convos.map(c => `
      <div class="chat-list-item" onclick="closeModal('chatListModal');startChat('${c.id}', '${escapeAttr(c.name)}')">
        <div class="chat-list-avatar">${(c.name || 'U').charAt(0).toUpperCase()}</div>
        <div class="chat-list-info">
          <div class="chat-list-name">${escapeHtml(c.name)}</div>
          <div class="chat-list-preview">${escapeHtml(c.last)}</div>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('chatListModal').classList.add('active');
}

async function loadMessages() {
  if (!currentChatUser) return;
  const roomId = getRoomId(currentUser.sub, currentChatUser.id);

  const { data } = await supabase
    .from('messages')
    .select('*')
    .eq('room_id', roomId)
    .order('created_at', { ascending: true });

  renderMessages(data || []);
}

function renderMessages(messages) {
  const box = document.getElementById('messagesBox');
  box.innerHTML = messages.map(m => {
    const isSelf = m.sender_id === currentUser.sub;
    const time = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    return `<div class="message ${isSelf ? 'self' : 'other'}">
      ${escapeHtml(m.content)}
      <div class="message-time">${time}</div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function subscribeToMessages() {
  if (messagesChannel) supabase.removeChannel(messagesChannel);
  const roomId = getRoomId(currentUser.sub, currentChatUser.id);

  messagesChannel = supabase
    .channel('messages_' + roomId)
    .on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'messages', filter: `room_id=eq.${roomId}` },
      () => loadMessages()
    )
    .subscribe();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentChatUser) return;

  const roomId = getRoomId(currentUser.sub, currentChatUser.id);
  input.value = '';

  await supabase.from('messages').insert({
    room_id: roomId,
    sender_id: currentUser.sub,
    sender_name: currentUser.preferred_username || 'User',
    receiver_id: currentChatUser.id,
    receiver_name: currentChatUser.name,
    content: text
  });
}

function closeChat() {
  closeModal('chatModal');
  if (messagesChannel) {
    supabase.removeChannel(messagesChannel);
    messagesChannel = null;
  }
  currentChatUser = null;
}

function base64UrlEncode(str) {
  return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function generateRandomString(len) {
  const array = new Uint8Array(len);
  crypto.getRandomValues(array);
  return Array.from(array, b => ('0' + b.toString(16)).slice(-2)).join('');
}
async function generateCodeChallenge(verifier) {
  const data = new TextEncoder().encode(verifier);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return base64UrlEncode(String.fromCharCode(...new Uint8Array(digest)));
}

async function startRobloxOAuth() {
  const verifier = generateRandomString(32);
  sessionStorage.setItem('roblox_code_verifier', verifier);
  const challenge = await generateCodeChallenge(verifier);
  const state = generateRandomString(16);
  sessionStorage.setItem('roblox_oauth_state', state);

  const params = new URLSearchParams({
    client_id: ROBLOX_CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'code',
    scope: 'openid profile',
    state: state,
    code_challenge: challenge,
    code_challenge_method: 'S256'
  });

  window.location.href = 'https://apis.roblox.com/oauth/v1/authorize?' + params.toString();
}

async function exchangeCodeForToken(code) {
  const verifier = sessionStorage.getItem('roblox_code_verifier');
  const body = new URLSearchParams({
    grant_type: 'authorization_code',
    code: code,
    redirect_uri: REDIRECT_URI,
    client_id: ROBLOX_CLIENT_ID,
    code_verifier: verifier
  });
  const res = await fetch('https://apis.roblox.com/oauth/v1/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  });
  if (!res.ok) throw new Error('Token failed');
  return await res.json();
}

async function fetchUserInfo(token) {
  const res = await fetch('https://apis.roblox.com/oauth/v1/userinfo', {
    headers: { Authorization: 'Bearer ' + token }
  });
  return await res.json();
}

async function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const state = params.get('state');
  if (!code) return false;
  if (state !== sessionStorage.getItem('roblox_oauth_state')) return false;

  try {
    const tokens = await exchangeCodeForToken(code);
    const user = await fetchUserInfo(tokens.access_token);
    sessionStorage.setItem('roblox_user', JSON.stringify(user));
    window.history.replaceState({}, document.title, window.location.pathname);
    return true;
  } catch (e) {
    console.error(e);
    return false;
  }
}

function showMainPage() {
  const stored = sessionStorage.getItem('roblox_user');
  if (!stored) return;
  currentUser = JSON.parse(stored);

  const displayName = currentUser.preferred_username || 'User';
  const avatarUrl = currentUser.picture || generateAvatar(displayName);

  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';
  document.getElementById('headerName').innerText = displayName;
  const img = document.getElementById('headerAvatar');
  img.src = avatarUrl;
  img.onerror = function() { this.onerror = null; this.src = generateAvatar(displayName); };

  loadProducts();

  supabase
    .channel('products_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => loadProducts())
    .subscribe();
}

function logout() {
  sessionStorage.clear();
  location.reload();
}

window.addEventListener('DOMContentLoaded', async () => {
  const handled = await handleCallback();
  if (handled) {
    showMainPage();
  }
});
</script>
